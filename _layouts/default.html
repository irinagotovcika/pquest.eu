<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">PQuest</a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/method/' | relative_url }}">Method</a>
        <a href="{{ '/#trainings' | relative_url }}">Trainings</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-name">PQuest</p>

      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="{{ '/method/' | relative_url }}">Method</a>
        <a href="{{ '/brave/' | relative_url }}">PQuest Brave</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/support/' | relative_url }}">Support / Contact</a>
      </nav>

      <p class="copyright">&copy; 2026 PQuest</p>
    </div>
  </footer>

</body>
</html>

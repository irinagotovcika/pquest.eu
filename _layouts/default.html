<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">
  <img src="{{ '/assets/PQuest_symbol_PQuest_primary_transparent.png' | relative_url }}" alt="" class="site-logo">
  <span>PQuest</span>
</a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/method/' | relative_url }}">Method</a>
        <a href="{{ '/#trainings' | relative_url }}">Trainings</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-name">PQuest</p>
      <p>An independent project by Irina Gotovcika.</p>
      <p>VAT No. IT01524540299</p>
      
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="{{ '/method/' | relative_url }}">Method</a>
        <a href="{{ '/brave/' | relative_url }}">PQuest Brave</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="{{ '/support/' | relative_url }}">Support / Contact</a>
      </nav>

      <p class="copyright">&copy; 2026 Irina Gotovcika</p>
    </div>
  </footer>

</body>
</html>
